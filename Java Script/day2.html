<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let num = 10;
        document.write("Number is : " + num);

        var name = "Asif";
        let lastName;
        lastName = "Mulla";

        console.log("Name : " + name + "\nSurname : " + lastName);

        function add()
        {
            let a = 100, b = 400;
            let c = a + b;
            document.write("<br>Addition is : " + c);
        }
        add();

        console.log("Type of num : " + typeof num);
        console.log("Type of lastName : " + typeof lastName);
        console.log("Type of Function : " + typeof add);
        
    </script>
</body>
</html>
